[mod-setting-description]
wp-observation-buggy-chart-radius=How far the buggy reveals the map around itself, in tiles.
wp-observation-buggy-chart-interval=How often the buggy refreshes the map around it. 60 ticks = once a second.
wp-observation-buggy-ping-seconds=How often you hear the radar ping while riding in an observation buggy. 0 turns it off.
